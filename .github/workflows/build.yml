name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-linux:
    name: Build on Ubuntu 22.04
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          g++ \
          libgl1-mesa-dev \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libqt6xml6 \
          libqt6core6 \
          libqt6widgets6
        
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G Ninja \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt6 \
          ..
          
    - name: Build
      run: |
        cd build
        ninja
        
    - name: Run tests
      run: |
        cd build
        ./tests
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: build/AnalyticsApp
        
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install Qt (simplified for CI)
      shell: pwsh
      run: |
        # В реальном проекте здесь будет установка Qt через официальный установщик
        # Для CI используем упрощенный подход
        echo "Qt installation would go here"
        
    - name: Configure CMake
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 ..
        
    - name: Build
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release
        
    - name: Run tests
      shell: pwsh
      run: |
        cd build/Release
        .\tests.exe
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: build/Release/AnalyticsApp.exe
        
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install clang-tidy and clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy clang-format
        
    - name: Check code formatting
      run: |
        find src -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | xargs clang-format --dry-run --Werror
        
    - name: Run clang-tidy
      run: |
        # Пока пропускаем, т.к. нужна компиляция
        echo "clang-tidy check will be added after project builds"